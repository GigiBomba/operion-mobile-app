name: Flutter Tests & Coverage

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/test-flutter.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/test-flutter.yml"
  workflow_dispatch:
    inputs:
      update_goldens:
        description: "Regenerate golden PNGs (--update-goldens) — commit the produced *-linux.png files"
        required: false
        default: "false"
        type: boolean

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Pinned to the local SDK that generated the goldens — golden
        # pixels are Flutter-version-sensitive; bump together with a
        # `flutter test --update-goldens` regeneration.
        flutter-version: ["3.44.6"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter ${{ matrix.flutter-version }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests with coverage
        run: |
          UPDATE_ARGS=""
          if [ "${{ github.event.inputs.update_goldens }}" = "true" ]; then
            UPDATE_ARGS="--update-goldens"
          fi
          flutter test --coverage $UPDATE_ARGS --machine > test-results.json
        env:
          CI: true

      - name: Generate coverage report (lcov)
        run: |
          flutter test --coverage
          sudo apt-get update
          sudo apt-get install -y lcov
          genhtml coverage/lcov.info -o coverage/html

      - name: Upload regenerated goldens (update-goldens run)
        if: github.event.inputs.update_goldens == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-goldens-${{ matrix.flutter-version }}
          path: mobile/test/**/*.png
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results-${{ matrix.flutter-version }}
          path: |
            mobile/test-results.json
            mobile/test/**/failures/
            mobile/test/failures/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ matrix.flutter-version }}
          path: |
            mobile/coverage/
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          echo "## Flutter ${{ matrix.flutter-version }} coverage results" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/lcov.info ]; then
            LF=$(grep "^LF:" coverage/lcov.info | awk -F: '{s+=$2} END {print s}')
            LH=$(grep "^LH:" coverage/lcov.info | awk -F: '{s+=$2} END {print s}')
            if [ "$LF" -gt 0 ] 2>/dev/null; then
              PCT=$(awk "BEGIN {printf \"%.2f\", ($LH / $LF) * 100}")
              echo "- **Line coverage:** ${PCT}%" >> $GITHUB_STEP_SUMMARY
            fi
          fi
