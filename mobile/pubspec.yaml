name: operion_mobile
description: "Operion Mobile — Logistics ERP companion app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # State management
  flutter_riverpod: ^2.6.1
  # Networking
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.3
  # Storage
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  # Push notifications
  # Upgraded from 3.15.2 / 15.2.x to the 4.x / 16.x line: the prebuilt
  # Firebase C++ SDK shipped with the 3.x/15.x plugins is compiled with an
  # older MSVC STL and fails to link against MSVC 17.14
  # (LNK2019: unresolved __std_find_last_trivial_1) on Windows.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  # Connectivity & device
  connectivity_plus: ^6.1.4
  local_auth: ^2.3.0
  # UI
  lucide_icons_flutter: ^3.1.4
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  # Camera & images
  image_picker: ^1.1.2
  image: ^4.5.3
  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Geolocation
  geolocator: ^13.0.2
  # URL launcher
  url_launcher: ^6.3.1
  # Utils
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  logging: ^1.3.0
  cupertino_icons: ^1.0.8
  flutter_foreground_task: ^10.0.0
  # Phase 0 — invoicing, CMR & e-Factura (§4.5)
  decimal: ^3.2.6
  # Phase 0 — file import (tachograph .ddd, docs) & signature capture
  file_picker: ^11.0.3
  signature: ^6.4.0
  # Phase 0 — PDF preview (see features/invoicing/README.md ADR)
  pdfx: ^2.9.2
  # Phase 0 — crash reporting (§8.4); no-op without a SENTRY_DSN dart-define
  sentry_flutter: ^9.26.0
  # Phase 2 — analytics charts (§4.4) & export share sheet (§4.8)
  fl_chart: ^1.1.1
  share_plus: ^10.1.4
  # Phase 3B — Android FLAG_SECURE screen-capture prevention (§12).
  # NOTE: the abandoned `flutter_windowmanager` pub package (AGP 9-incompatible)
  # was replaced by a local MethodChannel handler in MainActivity.kt using the
  # SAME channel contract; no dependency needed.
  # Phase 4B — persisted local settings (notification/data-usage/biometric toggles, §4.10)
  shared_preferences: ^2.5.3
  # Phase 5A — OS-integration trio (§9.1–9.3): home-screen widgets,
  # quick actions / app-icon shortcuts, rich local notifications with inline
  # actions (shown alongside data-only FCM pushes).
  home_widget: ^0.9.3
  quick_actions: ^1.1.0
  flutter_local_notifications: ^22.2.0
  # Phase 5A — timezone-aware scheduling for the bounded Snooze re-show
  # (flutter_local_notifications zonedSchedule).
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true  # for l10n
  assets:
    - assets/images/
  fonts:
    # Inter bundled locally (vs. fetched at runtime by google_fonts) so golden
    # tests and offline builds render deterministic glyphs on every machine —
    # CI runners cannot fetch Google Fonts during `flutter test`.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
